name: refresh scam lists
on:
  schedule: [{cron: "17 4 * * 1"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install httpx
      - run: python scripts/refresh_blocklists.py
      - run: |
          git config user.name "rugradar-bot"; git config user.email "rugradar-bot@users.noreply.github.com"
          git add rugradar/data/*.gz
          git diff --cached --quiet || (git commit -m "Weekly scam-list refresh" && git push)
