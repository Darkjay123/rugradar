<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RugRadar: is this token a scam?</title>
<style>
:root{--bg:#0b1410;--card:#13211b;--ink:#e8f5ee;--mute:#8fb3a1;--g:#3ee08f;--y:#f5c242;--r:#ff5d5d}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}h1{font-size:26px;margin:8px 0 4px}p.sub{color:var(--mute);margin:0 0 20px}
form{display:grid;gap:10px}select,input,button{font:inherit;padding:14px;border-radius:12px;border:1px solid #23392f;background:var(--card);color:var(--ink);width:100%}
button{background:var(--g);color:#05140c;font-weight:700;border:0}button:disabled{opacity:.6}
.card{background:var(--card);border-radius:16px;padding:18px;margin-top:20px}.v{font-weight:800;font-size:20px}
.LOW_RISK{color:var(--g)}.CAUTION{color:var(--y)}.HIGH_RISK{color:var(--r)}.UNKNOWN{color:var(--mute)}
ul{padding-left:18px;margin:10px 0 0}li{margin:6px 0}.meta{color:var(--mute);font-size:13px;margin-top:12px}
.ex{color:var(--mute);font-size:14px;margin-top:14px}.ex a{color:var(--g);cursor:pointer}
</style></head><body><main>
<h1>Is this token a scam?</h1><p class="sub">Paste a token's contract address before you buy. We check the code and the market and tell you in plain English.</p>
<form id="f"><select id="chain"><option value="bsc">BNB Chain</option><option value="ethereum">Ethereum</option><option value="base">Base</option><option value="polygon">Polygon</option><option value="arbitrum">Arbitrum</option></select>
<input id="addr" placeholder="0x... contract address" autocomplete="off" required><button id="go">Check it</button></form>
<div class="ex">Try: <a data-c="ethereum" data-a="0x1f9840a85d5af5bf1d1762f925bdaddc4201f984">UNI on Ethereum</a> · <a data-c="bsc" data-a="0x0e09fabb73bd3ade0a17ecc321fd13a19e81ce82">CAKE on BNB Chain</a></div>
<div id="out"></div>
<p class="meta">Free, no wallet connection, nothing to sign. A clean result is not a guarantee: only use money you can afford to lose.</p>
</main><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.querySelectorAll('.ex a').forEach(a=>a.onclick=()=>{$('#chain').value=a.dataset.c;$('#addr').value=a.dataset.a;$('#f').requestSubmit()});
$('#f').onsubmit=async e=>{e.preventDefault();const b=$('#go');b.disabled=true;b.textContent='Checking...';$('#out').innerHTML='';
try{const r=await fetch(`/api/check?chain=${$('#chain').value}&address=${encodeURIComponent($('#addr').value.trim())}`);const j=await r.json();
if(!r.ok){$('#out').innerHTML=`<div class="card">${esc(j.detail||'Something went wrong')}</div>`;return}
const label={LOW_RISK:'Low risk',CAUTION:'Be careful',HIGH_RISK:'High risk',UNKNOWN:'Not found'}[j.verdict];
$('#out').innerHTML=`<div class="card"><div class="v ${j.verdict}">${label} · ${j.score}/100</div><p>${esc(j.summary)}</p>
<ul>${j.findings.filter(f=>f.points>0).map(f=>`<li>${esc(f.plain)}</li>`).join('')}</ul><div class="meta">Check ${j.trace_id} · ${j.latency_ms} ms</div></div>`}
catch(err){$('#out').innerHTML='<div class="card">Network problem. Try again.</div>'}finally{b.disabled=false;b.textContent='Check it'}}
</script></body></html>
